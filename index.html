<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paiement, Météo & Google Sheet</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .payment-card {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 420px;
        }

        .weather-box {
            background: linear-gradient(135deg, #007bb5, #00c6ff);
            color: #ffffff;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .weather-box h3 {
            font-size: 16px;
            margin-bottom: 5px;
        }

        .weather-temp {
            font-size: 24px;
            font-weight: bold;
        }

        .payment-card h2 {
            text-align: center;
            color: #1c1e21;
            margin-bottom: 8px;
        }

        .payment-card p {
            text-align: center;
            color: #606770;
            font-size: 14px;
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #4b4f56;
            font-size: 14px;
        }

        .form-group input, 
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccd0d5;
            border-radius: 6px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-group input:focus, 
        .form-group select:focus {
            border-color: #25D366;
        }

        .btn-whatsapp {
            width: 100%;
            padding: 14px;
            background-color: #25D366;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            transition: background-color 0.2s;
        }

        .btn-whatsapp:hover {
            background-color: #128C7E;
        }
    </style>
</head>
<body>

<div class="payment-card">
    <div class="weather-box" id="weatherBox">
        <h3 id="weatherCity">Météo en cours...</h3>
        <div class="weather-temp" id="weatherTemp">-- °C</div>
        <div id="weatherDesc">Chargement des données...</div>
    </div>

    <h2>Formulaire de Paiement</h2>
    <p>Remplissez les détails ci-dessous pour effectuer votre paiement.</p>

    <form id="paymentForm" onsubmit="processForm(event)">
        <div class="form-group">
            <label for="name">Nom complet</label>
            <input type="text" id="name" required placeholder="Ex: Jean Dupont">
        </div>

        <div class="form-group">
            <label for="email">Adresse E-mail</label>
            <input type="email" id="email" required placeholder="Ex: jean@example.com">
        </div>

        <div class="form-group">
            <label for="amount">Montant</label>
            <input type="number" id="amount" min="1" step="any" required placeholder="Ex: 50">
        </div>

        <div class="form-group">
            <label for="method">Moyen de paiement souhaité</label>
            <select id="method" required>
                <option value="Mobile Money">Mobile Money</option>
                <option value="Virement Bancaire">Virement Bancaire</option>
                <option value="Carte Bancaire">Carte Bancaire</option>
                <option value="Espèces">Espèces</option>
            </select>
        </div>

        <button type="submit" class="btn-whatsapp" id="submitBtn">
            Envoyer et Payer via WhatsApp
        </button>
    </form>
</div>

<script>
    // 1. URL Google Sheet Apps Script (Remplacez par VOTRE URL obtenue à l'Étape 2)
    const googleSheetUrl = "https://script.google.com/macros/s/VOTRE_SCRIPT_ID/exec";

    // 2. Numéro WhatsApp
    const phoneNumber = "25761046862"; // Mettez VOTRE numéro WhatsApp ici

    // Météo
    async function fetchWeather() {
        try {
            const response = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=-3.38&longitude=29.36&current_weather=true`);
            const data = await response.json();
            const temp = Math.round(data.current_weather.temperature);
            document.getElementById('weatherCity').innerText = `Météo à Bujumbura`;
            document.getElementById('weatherTemp').innerText = `${temp} °C`;
            document.getElementById('weatherDesc').innerText = `Vent: ${data.current_weather.windspeed} km/h`;
        } catch (error) {
            document.getElementById('weatherCity').innerText = "Météo indisponible";
        }
    }
    fetchWeather();

    // Traitement du Formulaire : Envoi vers Sheet + WhatsApp
    async function processForm(event) {
        event.preventDefault();

        const btn = document.getElementById('submitBtn');
        btn.innerText = "Traitement en cours...";
        btn.disabled = true;

        const formData = {
            name: document.getElementById('name').value,
            email: document.getElementById('email').value,
            amount: document.getElementById('amount').value,
            method: document.getElementById('method').value
        };

        // Envoi des données à Google Sheet
        try {
            await fetch(googleSheetUrl, {
                method: "POST",
                mode: "no-cors", // Nécessaire pour éviter le blocage CORS de Google Apps Script
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(formData)
            });
        } catch (error) {
            console.error("Erreur lors de l'enregistrement Sheet:", error);
        }

        // Redirection vers WhatsApp
        const message = `*NOUVELLE DEMANDE DE PAIEMENT*\n\n` +
                        `*Nom :* ${formData.name}\n` +
                        `*Email :* ${formData.email}\n` +
                        `*Montant :* ${formData.amount} $\n` +
                        `*Mode de paiement :* ${formData.method}\n\n` +
                        `Je souhaite procéder au paiement. Merci de me transmettre les instructions.`;

        const whatsappUrl = `https://wa.me/${phoneNumber}?text=${encodeURIComponent(message)}`;
        
        btn.innerText = "Envoyer et Payer via WhatsApp";
        btn.disabled = false;

        window.open(whatsappUrl, '_blank');
    }
</script>

</body>
</html>
